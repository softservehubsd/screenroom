<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Screenroom: your personal movie library.">
<title>Screenroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top-bar">
  <a class="logo" href="/">SCREENROOM</a>
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input id="searchInput" type="search" placeholder="Search movies, shows, genres..." autocomplete="off">
  </div>
</header>

<main id="rows" class="content-rows"></main>

<!-- Fullscreen video player -->
<div class="player" id="playerOverlay" aria-hidden="true">
  <button id="closePlayer" class="player-back" aria-label="Back">
    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <div id="playerTitle" class="player-title"></div>
  <video id="videoPlayer" controls playsinline preload="metadata"></video>
</div>

<!-- Movie / Series details modal -->
<div id="detailsBackdrop" class="backdrop">
  <section class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" data-close-details aria-label="Close">✕</button>
    <div id="detailsArt" class="modal-banner">
      <div class="modal-fade"></div>
      <div class="modal-banner-info">
        <h2 id="detailsTitle"></h2>
        <div class="modal-actions">
          <button id="detailsPlay" class="btn-play">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play
          </button>
          <button id="detailsList" class="btn-fav" aria-label="Add to favorites">＋</button>
        </div>
      </div>
    </div>
    <div class="modal-details">
      <div id="detailsMeta" class="modal-meta"></div>
      <p id="detailsSynopsis"></p>
      <div id="episodeList"></div>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
